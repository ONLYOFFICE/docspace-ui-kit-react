services:
  # What CI would run: build the image, run the suite, leave the report behind.
  # No port mapping -- nothing outside the container talks to Storybook.
  tests-ci:
    image: ui-kit-tests
    # Lets `WORKERS=1 pnpm test:e2e:docker:start` reach playwright.config.ts;
    # unset it resolves to "", which the config reads as "not set".
    environment:
      WORKERS: "${WORKERS:-}"
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./playwright-report:/app/playwright-report
  # Tests against the source baked into the image. Only the specs, the
  # Playwright config and the report directory come from the host, so a run
  # here exercises the committed sources, not the working tree.
  tests-local:
    image: ui-kit-tests
    # Lets `WORKERS=1 pnpm test:e2e:docker:start` reach playwright.config.ts;
    # unset it resolves to "", which the config reads as "not set".
    environment:
      WORKERS: "${WORKERS:-}"
    ports:
      - "6007:6007"
    volumes:
      - ./__tests__:/app/__tests__
      - ./playwright.config.ts:/app/playwright.config.ts
      - ./playwright-report:/app/playwright-report
  # Dev mode: mount source code so you can iterate without rebuilding the image.
  # Usage:
  #   docker-compose run --rm tests-dev pnpm exec playwright test
  #   docker-compose run --rm tests-dev pnpm exec playwright test __tests__/button/button.spec.ts
  #   docker-compose run --rm tests-dev pnpm exec playwright test --update-snapshots=changed
  tests-dev:
    image: ui-kit-tests
    # Lets `WORKERS=1 pnpm test:e2e:docker:start` reach playwright.config.ts;
    # unset it resolves to "", which the config reads as "not set".
    environment:
      WORKERS: "${WORKERS:-}"
    ports:
      - "6007:6007"
    volumes:
      # Source code — edit on host, rebuilt inside container
      - ./components:/app/components
      - ./assets:/app/assets
      - ./constants:/app/constants
      - ./context:/app/context
      - ./enums:/app/enums
      - ./hooks:/app/hooks
      - ./styles:/app/styles
      - ./types:/app/types
      - ./utils:/app/utils
      - ./providers:/app/providers
      - ./css:/app/css
      - ./fonts:/app/fonts
      - ./locales:/app/locales
      - ./.storybook:/app/.storybook
      # Tests and config
      - ./__tests__:/app/__tests__
      - ./playwright.config.ts:/app/playwright.config.ts
      # Reports output
      - ./playwright-report:/app/playwright-report
