name: Publish

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish:
    if: ${{github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'}}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Install pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Storybook
        run: pnpm run storybook-build
      - name: Publish Documentation
        env:
          GIT_WORK_TREE: ${{github.workspace}}/storybook-static
          GIT_INDEX_FILE: ${{runner.temp}}/gh-pages.index
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898283+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898283+github-actions[bot]@users.noreply.github.com
        run: |
          git fetch --quiet origin gh-pages
          # Pages serves every file with max-age=600, and an open tab keeps the
          # chunk map it loaded, so the previous build's chunks must outlive
          # it by one deploy. build-assets.txt lists the chunks a build made;
          # the previous one's are restored where this build has none, which
          # keeps exactly one generation back instead of all of them.
          (cd storybook-static && find assets -type f | LC_ALL=C sort > build-assets.txt)
          if git cat-file -e FETCH_HEAD:build-assets.txt 2>/dev/null; then
            git show FETCH_HEAD:build-assets.txt | LC_ALL=C sort > "$RUNNER_TEMP/previous-assets.txt"
            LC_ALL=C comm -23 "$RUNNER_TEMP/previous-assets.txt" storybook-static/build-assets.txt > "$RUNNER_TEMP/kept-assets.txt"
            if [ -s "$RUNNER_TEMP/kept-assets.txt" ]; then
              git -C storybook-static checkout FETCH_HEAD --pathspec-from-file="$RUNNER_TEMP/kept-assets.txt"
            fi
          fi
          git add --all
          tree=$(git write-tree)
          if [ "$tree" = "$(git rev-parse 'FETCH_HEAD^{tree}')" ]; then
            echo "gh-pages is up to date"
            exit 0
          fi
          repo="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          commit=$(git commit-tree "$tree" \
            -p FETCH_HEAD \
            -m "Update following ${GITHUB_SHA::8}" \
            -m "Commit: $repo/commit/$GITHUB_SHA" \
            -m "Run: $repo/actions/runs/$GITHUB_RUN_ID")
          git push --quiet origin "$commit:refs/heads/gh-pages"
