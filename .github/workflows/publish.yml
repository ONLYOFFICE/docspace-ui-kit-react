name: Publish

permissions:
  contents: write

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Release
    types:
      - completed

jobs:
  publish:
    if: ${{github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'}}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Install pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Storybook
        run: pnpm run storybook-build
      - name: Publish Documentation
        env:
          GIT_WORK_TREE: ${{github.workspace}}/storybook-static
          GIT_INDEX_FILE: ${{runner.temp}}/gh-pages.index
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898283+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898283+github-actions[bot]@users.noreply.github.com
        run: |
          git fetch --quiet origin gh-pages
          git add --all
          tree=$(git write-tree)
          if [ "$tree" = "$(git rev-parse 'FETCH_HEAD^{tree}')" ]; then
            echo "gh-pages is up to date"
            exit 0
          fi
          repo="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          commit=$(git commit-tree "$tree" \
            -p "$(git rev-list --max-parents=0 FETCH_HEAD)" \
            -m "Update following ${GITHUB_SHA::8}" \
            -m "Commit: $repo/commit/$GITHUB_SHA" \
            -m "Run: $repo/actions/runs/$GITHUB_RUN_ID")
          git push --force --quiet origin "$commit:refs/heads/gh-pages"
