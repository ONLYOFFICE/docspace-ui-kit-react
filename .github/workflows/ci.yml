name: CI

"on":
  push:
    branches: [master, develop, release/v*, hotfix/v*, feature/*, bugfix/*]
  pull_request:
    branches: [master, develop, release/v*, hotfix/v*, feature/*, bugfix/*]

env:
  NODE_VERSION: 24.x

jobs:
  lint-tsc-test:
    name: "Lint, TSC & Test"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # No `version` input: action-setup reads it from the `packageManager`
      # field in package.json, which is the single source of truth.
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Run Lint
        run: pnpm lint

      - name: Run TypeScript
        run: pnpm tsc

      - name: Run Tests
        run: pnpm test

  package:
    name: "Build & verify the package"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      # The build also runs the dist checks: no bundled dependencies, a single
      # extracted stylesheet, per-format type markers, and a report on any
      # "use client" directives rollup dropped.
      - name: Build
        run: pnpm build

      # Packs with pnpm and runs publint and attw against the real tarball.
      # This is what catches the defects the lint/tsc/test gate cannot see --
      # a broken build, entry points missing because publishConfig was not
      # applied, types that misrepresent the JavaScript.
      #
      # Blocking. It reported only for a long time because two known problems
      # failed it; both are closed, publint and attw are clean, and a
      # reporting-only packaging gate had already let a real defect through --
      # the package declared `type: commonjs` while `main` pointed at ESM, and
      # nobody saw the warning.
      - name: Verify the package (publint + attw)
        run: pnpm verify:package

      # locales/ is vendored and committed, and `pnpm build` no longer runs
      # the copy scripts, so what this prints is what a publish would ship --
      # translations included. `pnpm sync-locales` is a manual refresh from a
      # DocSpace checkout and never runs here.
      - name: Show what would be published
        run: pnpm pack --dry-run
