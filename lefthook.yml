# `skips` names a job that did not run -- above all the pre-push build, which
# runs only when a push changes the build's own code; without it a skipped
# build and a passed one look the same in the summary.
output:
  - meta
  - summary
  - skips

# Formats what is being committed, so the tree never drifts between commits and
# the `format` check below has nothing left to find. `stage_fixed` re-stages the
# files Prettier rewrote, so the commit carries the formatted bytes rather than
# leaving a dirty tree behind. Lefthook hides unstaged changes while this runs,
# so a partially staged file commits only its staged hunks -- verified, not
# assumed: a file staged with one edit and left with a second, unstaged one
# commits the first alone and keeps the second in the working tree.
#
# `--ignore-unknown` skips what Prettier has no parser for, and Prettier reads
# .prettierignore itself, so pnpm-lock.yaml, locales/, css/ and *.mdx are left
# alone here exactly as they are by `pnpm format`. The glob is still worth
# having: with no matching staged file lefthook skips the command outright
# rather than starting node to do nothing.
pre-commit:
  parallel: false
  commands:
    format:
      glob: "*.{ts,tsx,js,jsx,mjs,cjs,json,jsonc,scss,css,html,md,yml,yaml}"
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true

# A merge that git resolves by itself never runs pre-commit -- git runs
# `pre-merge-commit` for that hook, and only falls back to `pre-commit` when the
# merge conflicted and you conclude it with `git commit` by hand. So a merge
# from a branch that was never formatted walked straight past the hook above and
# failed the push instead: `release/v4.0.0` brought a stray blank line into
# selectors/utils/hooks/useAgentsHelper.tsx that way. Same command as
# pre-commit, for the same reason.
pre-merge-commit:
  parallel: false
  commands:
    format:
      glob: "*.{ts,tsx,js,jsx,mjs,cjs,json,jsonc,scss,css,html,md,yml,yaml}"
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true

# Cheapest and most likely to fail first: a typical miss is a formatting or
# lint slip, and there is no reason to find it after the tests and a build.
#
# `jobs` is a list, and its order is the order they run in. The `commands` map
# this used to be was sorted ALPHABETICALLY by lefthook whatever the file said,
# which is why every command once carried a `priority`. `piped` stops at the
# first failure; without it lefthook runs the rest anyway, so a formatting slip
# still paid for the build, the tests and the tarball -- 78 seconds to report
# something found in 5.
#
# The whole gate took about seven minutes on a 24-thread Windows machine, run
# end to end one step at a time. What brings a typical push under one:
#   - Prettier and tsc keep caches in node_modules/.cache (format, tsc);
#   - lint, tsc and the README checks are independent and run side by side;
#   - only the unit tests a change can reach run (test-changed.mjs);
#   - the build and the tarball run only when the build itself changed.
# CI runs every one of these in full on every pull request, so nothing here is
# the last line of defence.
pre-push:
  piped: true
  # Streams each job's output as it runs rather than after it finishes. The
  # option belongs to the hook: set on a single command, as it once was, it is
  # rejected by the schema and ignored.
  follow: true
  jobs:
    # Fixes rather than just reporting: it rewrites the offending files with
    # Prettier and then still stops the push, because a pre-push hook cannot
    # rewrite the commits already being pushed. It names the files it changed
    # and the amend command to fold them in. Passing straight through after
    # rewriting would push the unformatted commits and leave the fix stranded
    # in a dirty tree.
    - name: format
      run: pnpm format:gate

    # Each builds its own view of the tree and none writes anything another
    # reads, so they run at once and the group takes as long as the slowest.
    - name: static
      group:
        parallel: true
        jobs:
          - name: lint
            run: pnpm lint
          - name: tsc
            run: pnpm tsc
          # Structure and derived truth only; the `--compile` pass that
          # type-checks every example in every README takes half a minute and
          # runs in CI. `scripts/readme-allowlist.json` is `[]` -- a folder
          # listed there is a folder this step stops checking.
          - name: check-readme
            run: pnpm check:readme
          - name: readme-props
            run: pnpm readme:props:check
          - name: readme-catalogue
            run: pnpm readme:catalogue:check
          - name: surface
            run: pnpm surface:check
          # Selectors on the class or style attribute, outside the baseline
          # (.claude/rules/css-selectors.md).
          - name: css-selectors
            run: pnpm check:css-selectors

    # The unit tests whose imports reach a changed file, or all of them when
    # the setup, the mocks, the locales, the lockfile or the configuration changed. CI runs
    # the full suite.
    - name: test
      run: pnpm test:changed

    # The gate used to stop at tsc, lint and test, which left the packaging
    # steps to CI -- and CI is Linux only. Three Windows-only breakages shipped
    # through that gap: `clean` called `rm -rf`, the per-module-css plugin keyed
    # its map by a raw module id, and check-dist compared `\` ids against POSIX
    # ones. All three were in the build's own code, so the build runs here when
    # a pushed commit touches that code -- the platform being tested is then the
    # developer's own. Any other push leaves it to CI's `package` job: a change
    # to a component cannot break the build in a way only Windows would see.
    #
    # Decided by a script rather than a `glob`: lefthook matches a glob against
    # `git diff HEAD @{push}`, which is empty for a branch's first push, so the
    # glob would skip the build on exactly the push that brings a new branch.
    # `skip` on "the build is untouched", not `only` on "it changed": lefthook
    # reads any non-zero exit as "no", and a script that crashes then builds.
    - name: package
      skip:
        - run: node scripts/build-untouched.mjs
      group:
        piped: true
        jobs:
          - name: build
            run: pnpm build
          - name: verify-package
            run: pnpm verify:package
